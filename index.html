<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 100 Días — AIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#000;--surface:#0D0D0D;--surface-2:#141414;--surface-3:#1C1C1C;
  --border:#1A1A1A;--border-2:#262626;
  --silver:#C4CDD8;--silver-2:#E0E6EE;--silver-3:#A0AABB;
  --silver-dim:rgba(196,205,216,0.12);--silver-glow:rgba(196,205,216,0.22);
  --white:#FFFFFF;--white-dim:rgba(255,255,255,0.08);
  --success:#3DBA7E;--success-dim:rgba(61,186,126,0.15);
  --error:#E05555;--error-dim:rgba(224,85,85,0.15);
  --gold:#F4C430;--gold-dim:rgba(244,196,48,0.14);
  --text:#FFFFFF;--text-2:#B0BCCB;--text-3:#6A7585;
  --font-d:'Syne',system-ui,sans-serif;--font-b:'DM Sans',system-ui,sans-serif;
  --r:10px;--r-sm:7px;--r-lg:16px;--shadow:0 8px 40px rgba(0,0,0,0.85);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;font-size:15px;}
#app{min-height:100vh;}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spinner{width:30px;height:30px;border:2.5px solid var(--surface-3);border-top-color:var(--silver);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;}
h1{font-weight:800;}h2{font-weight:700;}h3{font-weight:600;}
.logo-row{display:flex;align-items:center;gap:14px;}
.logo-100{font-family:var(--font-d);font-size:28px;font-weight:800;line-height:1;background:linear-gradient(175deg,#E8EDF4 0%,#C4CDD8 40%,#8A949F 70%,#D4DCE8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.02em;}
.logo-100.sm{font-size:20px;}
.logo-label{font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-2);display:block;line-height:1;margin-top:2px;}
.logo-reto{font-family:var(--font-d);font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:0.05em;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--r-sm);font-size:15px;font-weight:600;font-family:var(--font-b);cursor:pointer;border:none;transition:opacity 0.15s,transform 0.1s;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--white);color:#090909;width:100%;padding:14px;font-size:16px;font-weight:700;}
.btn-primary:hover:not(:disabled){opacity:0.92;}
.btn-outline{background:transparent;border:1.5px solid var(--border-2);color:var(--text-2);padding:10px 20px;font-size:14px;}
.btn-outline:hover:not(:disabled){border-color:var(--silver-3);color:var(--text);}
.welcome-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.welcome-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:48px 40px;width:100%;max-width:460px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.welcome-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--silver),transparent);}
.field-group{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
.field-label{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:0.04em;text-transform:uppercase;}
.field-input{background:var(--surface-2);border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:12px 16px;font-size:15px;color:var(--text);font-family:var(--font-b);width:100%;outline:none;transition:border-color 0.15s;}
.field-input:focus{border-color:var(--silver-3);}
.field-input::placeholder{color:var(--text-3);}
.err-msg{color:var(--error);font-size:12px;display:none;}
.err-msg.show{display:block;}
.profile-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.profile-opt{background:var(--surface-2);border:1.5px solid var(--border-2);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:border-color 0.15s,background 0.15s;display:flex;gap:16px;align-items:flex-start;text-align:left;font-family:inherit;}
.profile-opt:hover{border-color:var(--silver-3);background:var(--surface-3);}
.profile-opt.selected{border-color:var(--silver);background:var(--silver-dim);}
.profile-opt-icon{font-size:26px;line-height:1;flex-shrink:0;}
.profile-opt-title{font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
.profile-opt-desc{font-size:13px;color:var(--text-2);line-height:1.4;}
.dashboard{display:grid;grid-template-columns:1fr 280px;grid-template-rows:auto 1fr;max-width:1060px;margin:0 auto;padding:24px;gap:20px;min-height:100vh;}
.dash-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--border);}
.header-right{display:flex;align-items:center;gap:12px;}
.pts-chip{display:flex;align-items:center;gap:6px;background:var(--silver-dim);border:1px solid var(--silver-glow);padding:7px 14px;border-radius:100px;}
.pts-val{font-family:var(--font-d);font-size:17px;font-weight:800;color:var(--silver-2);font-variant-numeric:tabular-nums;}
.pts-lbl{font-size:11px;font-weight:600;color:var(--silver-3);}
.avatar{width:34px;height:34px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:12px;color:var(--text-2);}
.dash-main{display:flex;flex-direction:column;gap:16px;}
.hero-banner{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r);padding:22px 28px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;flex-wrap:wrap;}
.hero-banner::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--silver-3),transparent);}
.hero-100{font-family:var(--font-d);font-size:64px;font-weight:800;line-height:1;letter-spacing:-0.04em;flex-shrink:0;background:linear-gradient(175deg,#E8EDF4 0%,#C4CDD8 35%,#8A949F 65%,#D4DCE8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-divider{width:1px;height:50px;background:var(--border-2);flex-shrink:0;}
.hero-info{flex:1;min-width:0;}
.hero-name{font-family:var(--font-d);font-size:17px;font-weight:700;}
.hero-badge{display:inline-flex;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-2);margin-top:4px;}
.hero-rank{font-family:var(--font-d);font-size:12px;color:var(--text-2);margin-top:5px;}
.hero-rank span{color:var(--silver-2);font-weight:700;}
.hero-pts{margin-left:auto;text-align:right;flex-shrink:0;}
.hero-pts-num{font-family:var(--font-d);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);display:block;}
.hero-pts-lbl{font-size:12px;color:var(--text-2);}
.day-group{display:flex;flex-direction:column;gap:8px;}
.day-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px;}
.reto-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:16px;}
.reto-card.available{border-color:transparent;position:relative;cursor:pointer;}
.reto-card.available::before{content:'';position:absolute;inset:-1px;border-radius:calc(var(--r)+1px);background:linear-gradient(90deg,#555,#C4CDD8,#8A949F,#E0E6EE,#555);background-size:300% 100%;animation:sheen 3s linear infinite;z-index:-1;}
@keyframes sheen{to{background-position:-300% 0;}}
@media(prefers-reduced-motion:reduce){.reto-card.available::before{animation:none;}}
.reto-card.available:hover{background:var(--surface-2);}
.reto-card.done{opacity:0.55;}
.reto-card.locked{opacity:0.4;}
.r-icon{font-size:24px;line-height:1;flex-shrink:0;}
.r-info{flex:1;min-width:0;}
.r-title{font-family:var(--font-d);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-status{font-size:12px;color:var(--text-2);margin-top:2px;}
.r-status.ok{color:var(--silver-2);font-weight:600;}
.r-status.done{color:var(--success);font-weight:600;}
.play-btn{background:var(--white);color:#090909;border:none;border-radius:var(--r-sm);padding:8px 16px;font-weight:700;font-family:var(--font-b);font-size:13px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:opacity 0.15s,transform 0.1s;}
.play-btn:hover{opacity:0.88;}
.play-btn:active{transform:scale(0.97);}
.xp-badge{text-align:right;flex-shrink:0;}
.xp-num{font-family:var(--font-d);font-size:18px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;display:block;}
.xp-lbl{font-size:10px;color:var(--text-3);}
.lock-ico{color:var(--text-3);font-size:16px;flex-shrink:0;}
.lb-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;height:fit-content;position:sticky;top:24px;}
.lb-title{font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text);}
.lb-list{display:flex;flex-direction:column;gap:3px;}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);}
.lb-row.me{background:var(--silver-dim);border:1px solid var(--silver-glow);}
.lb-pos{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--text-3);width:22px;text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums;}
.lb-name{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-name.me-n{color:var(--silver-2);font-weight:700;}
.lb-xp{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--text-3);flex-shrink:0;font-variant-numeric:tabular-nums;}
.lb-xp.me-p{color:var(--gold);}
.lb-empty{text-align:center;padding:20px 0;color:var(--text-3);font-size:13px;}
.reto-screen{min-height:100vh;display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding:24px;gap:18px;}
.reto-hdr{display:flex;align-items:center;gap:14px;}
.reto-close{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:18px;padding:4px;line-height:1;flex-shrink:0;transition:color 0.15s;}
.reto-close:hover{color:var(--text);}
.reto-hdr-title{font-family:var(--font-d);font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xp-chip{display:flex;align-items:center;gap:5px;background:var(--gold-dim);border:1px solid rgba(244,196,48,0.2);padding:5px 12px;border-radius:100px;font-family:var(--font-d);font-size:13px;font-weight:800;color:var(--gold);flex-shrink:0;}
.card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:28px 26px;position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border-2),transparent);overflow:hidden;border-radius:var(--r-lg) var(--r-lg) 0 0;}
.card-eye{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;}
.card-title{font-family:var(--font-d);font-size:20px;font-weight:700;line-height:1.3;margin-bottom:8px;}
.card-desc{font-size:14px;color:var(--text-2);line-height:1.5;margin-bottom:20px;}
.agents-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.agent-card{background:var(--surface-2);border:2px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color 0.15s,background 0.15s;text-align:left;font-family:inherit;}
.agent-card:hover{border-color:var(--silver-3);background:var(--surface-3);}
.agent-card.selected{border-color:var(--silver-2);background:rgba(196,205,216,0.2);box-shadow:0 0 0 1px var(--silver-2),inset 0 0 0 1px var(--silver-2);}
.agent-card.selected .agent-name::after{content:' ✓';color:var(--silver-2);}
.agent-card-locked{cursor:default;pointer-events:none;}
.agent-card-front{cursor:pointer;}
.agent-card.correct{border-color:var(--success);background:var(--success-dim);box-shadow:0 0 0 1px var(--success);}
.agent-card.wrong{border-color:var(--error);background:var(--error-dim);box-shadow:0 0 0 1px var(--error);}
.agent-card.eliminated{opacity:0.3;pointer-events:none;}
.agent-emoji{font-size:32px;display:block;margin-bottom:10px;}
.agent-name{font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:3px;}
.agent-handle{font-size:12px;color:var(--text-3);margin-bottom:8px;}
.agent-bio{font-size:12px;color:var(--text-2);line-height:1.4;}
.vote-bar{height:6px;border-radius:100px;background:var(--surface-3);margin-top:10px;overflow:hidden;}
.vote-bar-fill{height:100%;background:var(--silver);border-radius:100px;transition:width 0.6s ease;}
.vote-pct{font-size:11px;color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums;}
.clues-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.clue-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 16px;font-size:14px;color:var(--text-2);animation:fadein 0.3s ease;}
.budget-channels{display:flex;flex-direction:column;gap:16px;margin-bottom:20px;}
.budget-ch{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;}
.budget-ch-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.budget-ch-name{font-family:var(--font-d);font-size:14px;font-weight:700;}
.budget-ch-val{font-family:var(--font-d);font-size:16px;font-weight:800;color:var(--gold);}
.budget-slider{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:var(--surface-3);border-radius:100px;outline:none;cursor:pointer;}
.budget-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--silver-2);border-radius:50%;cursor:pointer;border:2px solid var(--bg);}
.budget-remaining{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:16px;}
.budget-rem-lbl{font-size:13px;color:var(--text-2);}
.budget-rem-val{font-family:var(--font-d);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.budget-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.budget-result-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;text-align:center;}
.budget-result-num{font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--success);display:block;}
.budget-result-lbl{font-size:11px;color:var(--text-2);}
.funnel-suspect{padding:12px 14px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:default;transition:border-color 0.12s,background 0.12s;}
.funnel-suspect.selected{border-color:var(--silver);background:var(--silver-dim);}
.btn-inv{font-family:var(--font-b);font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-3);color:var(--text-2);cursor:pointer;transition:background 0.12s,border-color 0.12s;white-space:nowrap;}
.btn-inv:hover:not(.inv-done){border-color:var(--silver-3);background:var(--surface-2);}
.btn-inv.inv-done{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.3);color:var(--success);cursor:default;}
.path-opt[data-chosen]{border-color:var(--silver);background:var(--silver-dim);}
.path-opt[data-chosen] .path-letter{background:var(--silver);color:#000;}
.path-opts{display:flex;flex-direction:column;gap:8px;}
.path-opt{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;text-align:left;font-family:var(--font-b);font-size:14px;color:var(--text);line-height:1.4;transition:border-color 0.12s,background 0.12s;}
.path-opt:hover:not([data-locked]){border-color:var(--border-2);background:var(--surface-3);}
.path-opt[data-correct]{border-color:var(--success);background:var(--success-dim);}
.path-opt[data-wrong]{border-color:var(--error);background:var(--error-dim);}
.path-letter{width:28px;height:28px;border-radius:6px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:11px;font-weight:800;color:var(--text-3);flex-shrink:0;}
.path-opt[data-correct] .path-letter{background:var(--success);color:#fff;}
.path-opt[data-wrong] .path-letter{background:var(--error);color:#fff;}
.complete-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.complete-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:44px 38px;width:100%;max-width:460px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.complete-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--silver),transparent);}
.complete-emoji{font-size:56px;display:block;margin-bottom:16px;}
.complete-title{font-size:22px;margin-bottom:6px;}
.complete-sub{color:var(--text-2);margin-bottom:22px;font-size:14px;}
.xp-box{background:var(--gold-dim);border:1px solid rgba(244,196,48,0.25);border-radius:var(--r);padding:20px;margin-bottom:16px;}
.xp-big{font-family:var(--font-d);font-size:52px;font-weight:800;line-height:1;display:block;font-variant-numeric:tabular-nums;color:var(--gold);}
.xp-box-lbl{font-size:13px;color:var(--text-2);margin-top:4px;}
.xp-breakdown{display:flex;gap:8px;justify-content:center;margin-top:12px;}
.xp-part{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 16px;flex:1;}
.xp-part-num{font-family:var(--font-d);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:block;}
.xp-part-lbl{font-size:11px;color:var(--text-2);}
.open-loop{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;text-align:left;}
.open-loop-eye{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver-3);margin-bottom:6px;}
.open-loop-text{font-size:13px;color:var(--text-2);line-height:1.5;}
.rank-change{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--text-2);margin-bottom:16px;}
.rank-change strong{color:var(--silver-2);font-family:var(--font-d);}
.fadein{animation:fadein 0.22s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.fadein{animation:none;}}
@media(max-width:740px){
  .dashboard{grid-template-columns:1fr;padding:16px;gap:14px;}
  .dash-header{grid-column:1;}
  .lb-sidebar{position:static;}
  .welcome-card{padding:32px 22px;}
  .agents-grid{grid-template-columns:1fr 1fr;}
  .complete-card{padding:32px 20px;}
  .hero-100{font-size:48px;}
  .hero-divider{height:40px;}
}
@media(max-width:480px){
  .agents-grid{grid-template-columns:1fr;}
  .budget-result-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    <p style="color:var(--text-2);font-size:13px;margin-top:4px">Cargando...</p>
  </div>
</div>
<script>
// ─── SUPABASE ADAPTER ──────────────────────────────────────────────
function makeDb(SUPABASE_URL, SUPABASE_KEY) {
  const BASE = SUPABASE_URL + '/rest/v1';
  const hdrs = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };

  async function q(table, qp, opts) {
    opts = opts || {};
    const url = BASE + '/' + table + (qp ? '?' + qp : '');
    const res = await fetch(url, {
      method: opts.method || 'GET',
      headers: Object.assign({}, hdrs, opts.extra || {}),
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
    if (!res.ok && res.status !== 204) {
      const txt = await res.text();
      throw new Error('Supabase ' + res.status + ': ' + txt);
    }
    if (res.status === 204 || opts.method === 'PATCH' || opts.method === 'DELETE') return null;
    return res.json();
  }

  function rowToUser(row) {
    return {
      username: row.username,
      type: row.type,
      xp: row.xp || 0,
      activeSeconds: row.active_seconds || 0,
      completedRetos: row.completed_retos || {}
    };
  }

  function userToRow(data) {
    const row = {};
    if (data.username !== undefined) row.username = data.username;
    if (data.type !== undefined) row.type = data.type;
    if (data.xp !== undefined) row.xp = data.xp;
    if (data.activeSeconds !== undefined) row.active_seconds = data.activeSeconds;
    if (data.active_seconds !== undefined) row.active_seconds = data.active_seconds;
    if (data.completedRetos !== undefined) row.completed_retos = data.completedRetos;
    if (data.completed_retos !== undefined) row.completed_retos = data.completed_retos;
    return row;
  }

  return {
    doc: function(path) {
      const parts = path.split('/');
      const col = parts[0], id = parts[1];
      return {
        get: async function() {
          if (col === 'users') {
            const rows = await q('arena_users', 'username=eq.' + encodeURIComponent(id) + '&limit=1');
            if (!rows || !rows.length) return { exists: false, data: function(){ return null; } };
            const u = rowToUser(rows[0]);
            return { exists: true, data: function(){ return u; } };
          }
          if (col === 'votes') {
            const rows = await q('arena_votes', 'reto_id=eq.' + encodeURIComponent(id));
            if (!rows || !rows.length) return { exists: false, data: function(){ return {}; } };
            const votes = {};
            rows.forEach(function(r){ votes[r.agent_id] = r.count; });
            return { exists: true, data: function(){ return votes; } };
          }
          throw new Error('Unknown collection: ' + col);
        },
        set: async function(data) {
          if (col === 'users') {
            const row = userToRow(data);
            row.username = id;
            await q('arena_users', '', {
              method: 'POST',
              extra: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
              body: row
            });
          }
          if (col === 'votes') {
            const rows = Object.keys(data).map(function(agentId){
              return { reto_id: id, agent_id: agentId, count: data[agentId] };
            });
            if (!rows.length) return;
            await q('arena_votes', '', {
              method: 'POST',
              extra: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
              body: rows
            });
          }
        },
        update: async function(partial) {
          if (col === 'users') {
            const row = userToRow(partial);
            delete row.username;
            await q('arena_users', 'username=eq.' + encodeURIComponent(id), {
              method: 'PATCH',
              extra: { 'Prefer': 'return=minimal' },
              body: row
            });
          }
        }
      };
    },
    collection: function(colName) {
      let _ob = null, _dir = 'asc', _lim = null, _where = null;
      const self = {
        orderBy: function(f, d) { _ob = f; _dir = d || 'asc'; return self; },
        limit: function(n) { _lim = n; return self; },
        where: function(field, op, val) { _where = {field, op, val}; return self; },
        _fetch: async function() {
          if (colName === 'users') {
            const parts = [];
            if (_where) parts.push(_where.field + '=' + _where.op + '.' + encodeURIComponent(_where.val));
            if (_ob) parts.push('order=' + _ob + '.' + _dir + '.nullslast');
            if (_lim) parts.push('limit=' + _lim);
            const rows = await q('arena_users', parts.join('&'));
            return (rows || []).map(function(row){
              const u = rowToUser(row);
              return { data: function(){ return u; } };
            });
          }
          return [];
        },
        onSnapshot: function(cb, errCb) {
          let active = true;
          const run = async function() {
            if (!active) return;
            try {
              const docs = await self._fetch();
              cb({ docs: docs });
            } catch(e) {
              if (errCb) errCb(e);
            }
          };
          run();
          const iv = setInterval(run, 15000);
          return function() { active = false; clearInterval(iv); };
        }
      };
      return self;
    }
  };
}

/* Modo pruebas: ?test=1 en la URL abre los retos sin tocar las fechas reales.
   Antes se falseaban las fechas en el codigo para poder probar y se quedaron
   puestas, asi que en produccion los seis salian abiertos desde el primer dia. */
const MODO_PRUEBAS = new URLSearchParams(location.search).get('test') === '1';

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function retoStatus(r){
  if(S.userData&&S.userData.completedRetos&&S.userData.completedRetos[r.id]) return 'done';
  if(!MODO_PRUEBAS && todayStr()<r.date) return 'locked';
  return 'available';
}

function myRetos(){return RETOS.filter(r=>r.profile===S.userType);}
function totalXP(){return (S.userData&&S.userData.xp)||0;}
function msUntil(ds){return new Date(ds+'T09:00:00').getTime()-Date.now();}
function formatMs(ms){if(ms<=0)return{d:0,h:0,m:0,s:0};const t=Math.floor(ms/1000);return{d:Math.floor(t/86400),h:Math.floor((t%86400)/3600),m:Math.floor((t%3600)/60),s:t%60};}
function pad(n){return String(n).padStart(2,'0');}
function fmtSecs(s){if(!s)return'--';return Math.floor(s/60)+'m '+pad(s%60)+'s';}
function initials(s){return s.slice(0,2).toUpperCase();}
function rankLabel(r){if(!r)return'--';if(r===1)return'🥇';if(r===2)return'🥈';if(r===3)return'🥉';return'#'+r;}

/* Posicion tras completar un reto y cuanto se ha subido respecto a antes de
   jugarlo. completeReto guarda S.rankBefore justo antes de sumar el XP, y el
   snapshot del leaderboard refresca este texto cuando llega el dato nuevo. */
function rankChangeHtml(){
  if(!S.rank) return '';
  const antes=S.rankBefore;
  let salto='';
  if(antes&&antes>S.rank){
    const d=antes-S.rank;
    salto=', has subido '+d+(d===1?' posición':' posiciones');
  } else if(antes&&antes===S.rank){
    salto=', mantienes tu posición';
  }
  return '<strong>#'+S.rank+'</strong> del ranking'+salto;
}

function startLb(){
  if(!S.db) return;
  if(S.lbUnsub) S.lbUnsub();
  S.lbUnsub=S.db.collection('users').where('type','eq',S.userType).orderBy('xp','desc').limit(25).onSnapshot(function(snap){
    S.leaderboard=snap.docs.map(function(d,i){return Object.assign({rank:i+1},d.data());});
    const me=S.leaderboard.find(u=>u.username===S.username);
    S.rank=me?me.rank:null;
      const rcEl=$('rank-change');if(rcEl)rcEl.innerHTML=rankChangeHtml();
    const lbEl=$('lb-list');if(lbEl)renderLb(lbEl);
    const rEl=$('rank-pos');if(rEl)rEl.textContent=rankLabel(S.rank);
    const pEl=$('hdr-xp');if(pEl)pEl.textContent=totalXP().toLocaleString();
    const tEl=$('total-xp');if(tEl)tEl.textContent=totalXP().toLocaleString();
    const tEl2=$('lb-title-text');if(tEl2)tEl2.textContent=S.userType==='agent'?'Ranking Agentes 🏆':'Ranking No Agentes 🏆';
  },function(e){console.error('lb',e);});
}

function renderLb(container){
  if(!S.leaderboard.length){container.innerHTML='<div class="lb-empty">Sé el primero en jugar</div>';return;}
  container.innerHTML=S.leaderboard.map(function(u){
    const me=u.username===S.username;
    const pos=u.rank<=3?['','🥇','🥈','🥉'][u.rank]:String(u.rank);
    return '<div class="lb-row '+(me?'me':'')+'"><span class="lb-pos">'+pos+'</span><span class="lb-name '+(me?'me-n':'')+'">'+u.username+(me?' (tú)':'')+'</span><div style="text-align:right;flex-shrink:0"><div class="lb-xp '+(me?'me-p':'')+'">'+(u.xp||0)+' XP</div><div style="font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums">'+fmtSecs(u.activeSeconds||0)+'</div></div></div>';
  }).join('');
}

      </div>
      <button class="btn btn-primary" id="prof-btn" disabled>Empezar los 100 días →</button>
    </div>
  </div>`;
  let sel=null;const btn=$('prof-btn');
  ['agent','novice'].forEach(t=>{
    $('opt-'+t).addEventListener('click',()=>{
      document.querySelectorAll('.profile-opt').forEach(o=>o.classList.remove('selected'));
      $('opt-'+t).classList.add('selected');sel=t;btn.disabled=false;
    });
  });
  btn.addEventListener('click',async()=>{
    if(!sel)return;btn.disabled=true;btn.textContent='Creando perfil...';
    const u={username:S.username,type:sel,xp:0,activeSeconds:0,completedRetos:{}};
    try{await S.db.doc('users/'+S.username).set(u);}catch(e){console.warn('DB no disponible, modo local:',e);}
    S.userType=sel;S.userData=u;saveLocal();
    try{startLb();}catch(e){console.warn('Leaderboard no disponible',e);}
    renderDashboard();
  });
}

      }else if(st==='available'){
        statusHtml=`<div class="r-status ok">Disponible ahora</div>`;

        statusHtml=`<div class="r-status">${r.dayLabel}</div>`;

        <span class="r-icon">${r.emoji}</span>

  }).join('');

  const nextLocked=myRetos().find(r=>retoStatus(r)==='locked'&&todayStr()<r.date);

  app.innerHTML=`
  <div class="dashboard fadein">
    <header class="dash-header">
      <div>${logoHtml('sm')}</div>
      <div class="header-right">

        <div class="pts-chip"><span class="pts-val" id="hdr-xp">${totalXP()}</span><span class="pts-lbl">XP</span></div>
        <div class="avatar" title="${S.username}">${initials(S.username)}</div>
      </div>
    </header>
    <main class="dash-main">
      <div class="hero-banner">
        <div class="hero-100" id="rank-pos">${rankLabel(S.rank)}</div>
        <div class="hero-divider"></div>
        <div class="hero-info">
          <div class="hero-name">${S.username}</div>
          <div class="hero-badge">${typeLbl}</div>
          <div class="hero-rank">Clasificación global <span>${S.rank?'#'+S.rank:'--'}</span></div>
        </div>
        <div class="hero-pts">
          <span class="hero-pts-num" id="total-xp">${totalXP()}</span>
          <div class="hero-pts-lbl">XP acumulados</div>
        </div>
      </div>
      ${nextLocked?`<div class="card" style="padding:18px 24px">
        <div class="card-eye">Próximo reto · ${nextLocked.dayLabel}</div>
        <div style="font-family:var(--font-d);font-size:15px;font-weight:700;margin-bottom:14px">${nextLocked.title}</div>
        <div style="display:flex;gap:10px;align-items:flex-end">
          ${['d','h','m','s'].map((k,i)=>`${i>0?'<span style="font-family:var(--font-d);font-size:24px;font-weight:800;color:var(--surface-3);line-height:1;margin-bottom:10px">:</span>':''}<div style="text-align:center"><span style="font-family:var(--font-d);font-size:28px;font-weight:800;display:block;font-variant-numeric:tabular-nums;background:linear-gradient(175deg,#E0E6EE,#9098A8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text" id="cd-${k}">--</span><span style="font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;font-weight:600">${['días','horas','min','seg'][i]}</span></div>`).join('')}
        </div>
      </div>`:''}
      <div style="display:flex;flex-direction:column;gap:14px">${dayGroupsHtml}</div>
    </main>
    <aside class="lb-sidebar">
      <div class="lb-title" id="lb-title-text">Clasificación 🏆</div>

  if(nextLocked){

// ─── RETO SHELL ────────────────────────────────────────────────────
let _retoStartTime=0,_retoTimer=null;

function retoShellHtml(r,contentHtml,xpEarned){
  xpEarned=xpEarned||0;
  return `<div class="reto-screen fadein">
    <div class="reto-hdr">
      <button class="reto-close" id="rc">✕</button>
      <span class="reto-hdr-title">${r.emoji} ${r.title}</span>
      <div class="xp-chip">⚡ ${xpEarned} XP</div>
    </div>
    ${contentHtml}
  </div>`;
}

function initRetoClose(r){
  $('rc').addEventListener('click',()=>{if(confirm('¿Salir? Perderás el progreso de este reto.'))goBackToDash();});
}

function goBackToDash(){
  if(S.cdTimer)clearInterval(S.cdTimer);
  renderDashboard();startLb();
}

async function completeReto(r,xpEarned,bonusEarned,gotBonus){
  S.rankBefore=S.rank;   // para contar el salto en la pantalla de resultado
  const activeMs=Date.now()-_retoStartTime;
  const activeSecs=Math.floor(activeMs/1000);
  const newXP=(S.userData.xp||0)+xpEarned;
  const newSecs=(S.userData.activeSeconds||0)+activeSecs;
  const completedRetos=Object.assign({},(S.userData.completedRetos||{}));
  completedRetos[r.id]={xp:xpEarned,bonus:bonusEarned,gotBonus,completedAt:new Date().toISOString()};
  S.userData=Object.assign({},S.userData,{xp:newXP,activeSeconds:newSecs,completedRetos});
  saveLocal();
  try{await S.db.doc('users/'+S.username).set(S.userData);}catch(e){console.warn('DB sync fallida, progreso en local',e);}
  renderRetoComplete(r,xpEarned,bonusEarned,gotBonus);
}

function renderRetoComplete(r,xpEarned,bonusEarned,gotBonus){
  /* Neutral a proposito. Esta pantalla es comun a los 6 retos y decia
     '¡Decision correcta!' o 'Buena intuicion — casi.', delatando el veredicto
     que cada reto se cuida de no revelar. El porque se cuenta el 23. */
  const emoji='🏁';
  const msg='Respuesta guardada';
  app.innerHTML=`
  <div class="complete-screen fadein">
    <div class="complete-card">
      <span class="complete-emoji">${emoji}</span>
      <h2 class="complete-title">${msg}</h2>
      <p class="complete-sub">${r.title} completado</p>
      <div class="xp-box">
        <span class="xp-big">+${xpEarned}</span>
        <div class="xp-box-lbl">XP ganados</div>
      </div>
      <div class="open-loop">
        <div class="open-loop-eye">🔒 El porqué · 23 sep</div>
        <div class="open-loop-text">${r.revealTeaser}</div>
      </div>
      <div class="rank-change" id="rank-change">${rankChangeHtml()}</div>
      <button class="btn btn-primary" id="back-btn">Ver clasificación →</button>
    </div>
  </div>`;
  $('back-btn').addEventListener('click',goBackToDash);
}

// ─── RETO DISPATCH ─────────────────────────────────────────────────
function startReto(r){
  if(S.cdTimer){clearInterval(S.cdTimer);S.cdTimer=null;}
  _retoStartTime=Date.now();
  switch(r.type){
    case 'agent-pick':  playAgentPick(r);break;
    case 'agent-clues': playAgentClues(r);break;
    case 'budget':      playBudget(r);break;
    case 'funnel':      playFunnel(r);break;
    case 'graph':       playGraph(r);break;
    case 'bluff':       playBluff(r);break;
  }
}

// ─── R1: ¿A quién le darías tu casa? ───────────────────────────────
/* Flujo del spec: 4 perfiles -> confirmacion -> bloqueo -> resultado.
   Las valoraciones (confianza, diferenciacion, autoridad, valor) NO se ven
   antes de elegir: Roberto Silva puntua alto en las cuatro, asi que ensenarlas
   en la tarjeta regalaba la respuesta. Solo aparecen en el resultado, que es
   donde el spec las coloca y donde generan la incomodidad que busca el reto. */
function playAgentPick(r){
  let selected=null,expanded=null,phase='pick',votos={};
  const OPTIMO='d';   // Roberto Silva
  const numSeg=s=>parseInt(String(s).replace(/[^0-9]/g,''),10)||0;
  const nivel=v=>v>=65?'ALTA':(v>=35?'MEDIA':'BAJA');
  const colorNivel=v=>v>=65?'var(--success)':(v>=35?'var(--text-2)':'var(--error)');
  const agente=id=>r.agents.find(a=>a.id===id);

  function barrasHtml(a){
    const filas=[['Confianza','confianza'],['Diferenciación','diferenciacion'],['Autoridad','autoridad'],['Valor percibido','valor']];
    return filas.map(function(par){
      const etq=par[0], v=(a.barras&&a.barras[par[1]])||0;
      return `<div style="margin-bottom:15px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:6px">
          <span style="color:var(--text-2)">${etq}</span>
          <span style="font-weight:700;color:${colorNivel(v)}">${nivel(v)} · ${v}%</span>
        </div>
        <div class="vote-bar" style="margin-top:0"><div class="vote-bar-fill" style="width:${v}%"></div></div>
      </div>`;
    }).join('');
  }

  function tarjetasElegir(){
    return r.agents.map(function(a){
      const isExp=expanded===a.id, isSel=a.id===selected;
      return `<div class="agent-card ${isSel?'selected':''}" data-aid="${a.id}" style="cursor:pointer">
        <div class="agent-card-front" data-expand="${a.id}">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:${isExp?'10px':'0'}">
            <span class="agent-emoji" style="font-size:28px">${a.emoji}</span>
            <div><div class="agent-name" style="font-size:14px">${a.name}</div><div class="agent-handle">${a.handle} · ${a.seguidores} seg.</div></div>
          </div>
          ${isExp?`<div class="agent-bio" style="margin-bottom:8px">${a.bio}</div>${a.ubicacion?`<div style="font-size:11px;color:var(--text-3);margin-bottom:4px">📍 ${a.ubicacion}</div>`:''}${a.cta?`<div style="font-size:11px;color:var(--text-3);font-style:italic">${a.cta}</div>`:''}<div style="margin-top:12px"><button class="btn" data-select="${a.id}" style="width:100%;font-size:13px;padding:10px">Reunirme con este agente</button></div>`:`<div style="font-size:11px;color:var(--text-3);margin-top:4px">Toca para ver el perfil</div>`}
        </div>
      </div>`;
    }).join('');
  }

  function render(){
    if(phase==='pick'){
      app.innerHTML=retoShellHtml(r,`
        <div class="card"><div class="card-eye">Reto · Día 1</div><div class="card-title">${r.title}</div><div class="card-desc">${r.intro}</div>
          ${r.subIntro?`<div style="font-size:13px;color:var(--text-3);margin-bottom:16px">${r.subIntro}</div>`:''}
          <div class="agents-grid">${tarjetasElegir()}</div>
        </div>`);
      initRetoClose(r);
      document.querySelectorAll('[data-expand]').forEach(function(el){
        el.addEventListener('click',function(e){
          if(e.target.closest('[data-select]'))return;
          const aid=el.dataset.expand;
          expanded=expanded===aid?null:aid;
          render();
        });
      });
      document.querySelectorAll('[data-select]').forEach(function(btn){
        btn.addEventListener('click',function(e){
          e.stopPropagation();
          selected=btn.dataset.select;
          phase='confirm';
          render();
        });
      });
      return;
    }

    if(phase==='confirm'){
      const a=agente(selected);
      app.innerHTML=retoShellHtml(r,`
        <div class="card" style="text-align:center">
          <div style="font-size:44px;margin:10px 0 14px">${a.emoji}</div>
          <div class="card-title" style="margin-bottom:8px">¿Seguro que quieres reunirte con ${a.name}?</div>
          <div class="card-desc" style="margin-bottom:22px">Una vez confirmes, tu decisión queda bloqueada.</div>
          <button class="btn btn-primary" id="confirm-btn" style="width:100%;margin-bottom:10px">Sí, confirmar</button>
          <button class="btn" id="back-node" style="width:100%">Cambiar de opinión</button>
        </div>`);
      initRetoClose(r);
      $('back-node').addEventListener('click',function(){phase='pick';render();});
      $('confirm-btn').addEventListener('click',async function(){
        phase='lock';render();
        try{
          const voteRef=S.db.doc('votes/'+r.id);
          const snap=await voteRef.get();
          const v=snap.exists?snap.data():{};
          v[selected]=(v[selected]||0)+1;
          await voteRef.set(v);
        }catch(e){console.warn('Voto no registrado en la DB',e);}
        setTimeout(cargarVotosYRevelar,1200);
      });
      return;
    }

    if(phase==='lock'){
      app.innerHTML=retoShellHtml(r,`
        <div class="card" style="text-align:center;padding:56px 24px">
          <div style="font-size:52px;margin-bottom:16px">🔒</div>
          <div class="card-title">Decisión bloqueada</div>
        </div>`);
      initRetoClose(r);
      return;
    }

    // phase === 'result'
    const a=agente(selected);
    const total=Object.values(votos).reduce(function(x,y){return x+y;},0)||1;
    const masSeguidores=r.agents.reduce(function(m,x){return numSeg(x.seguidores)>numSeg(m.seguidores)?x:m;},r.agents[0]);
    const comparativa=masSeguidores.id===selected
      ? `El agente que elegiste es el que más seguidores tiene de los cuatro: <b>${a.seguidores}</b>.`
      : `El agente que elegiste tiene <b>${a.seguidores}</b> seguidores. Hay otro con <b>${masSeguidores.seguidores}</b> que no elegiste.`;
    const grupoHtml=r.agents.map(function(x){
      const pct=Math.round(((votos[x.id]||0)/total)*100);
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
          <span style="color:${x.id===selected?'var(--text-1)':'var(--text-3)'}">${x.emoji} ${x.name}${x.id===selected?' · tu elección':''}</span>
          <span style="color:var(--text-2);font-variant-numeric:tabular-nums">${pct}%</span>
        </div>
        <div class="vote-bar" style="margin-top:0"><div class="vote-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    const gotBonus=selected===OPTIMO;
    const bonus=gotBonus?(r.xpBonus||0):0;
    const xp=(r.xpBase||0)+bonus;

    app.innerHTML=retoShellHtml(r,`
      <div class="card">
        <div style="text-align:center;padding:8px 0 20px;border-bottom:1px solid var(--border-2);margin-bottom:20px">
          <div style="font-size:44px;margin-bottom:10px">${a.emoji}</div>
          <div style="font-family:var(--font-d);font-size:22px;font-weight:800;margin-bottom:10px">Has elegido a ${a.name}</div>
          <div style="font-size:14px;color:var(--text-2);line-height:1.55">Pero lo interesante no es a quién has elegido. Es <b>por qué</b> lo has elegido.</div>
        </div>
        <div style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:20px">El 23 de septiembre descubrirás <b>si has acertado (o no)</b> y qué ha hecho que ese perfil te transmita más confianza que los demás.</div>
        <div class="card-eye" style="margin-bottom:14px">Mientras tanto, mira qué transmite este perfil a primera vista 👇</div>
        ${barrasHtml(a)}
        <div style="margin:18px 0 22px;padding:14px 16px;border-radius:12px;background:var(--surface-3);font-size:13px;color:var(--text-2);line-height:1.55">${comparativa}</div>
        <div class="card-eye" style="margin-bottom:12px">Así está votando el grupo</div>
        ${grupoHtml}
        <div style="margin-top:20px"><button class="btn btn-primary" id="finish-btn" style="width:100%">Continuar →</button></div>
      </div>`,xp);
    initRetoClose(r);
    $('finish-btn').addEventListener('click',function(){completeReto(r,xp,bonus,gotBonus);});
  }

  async function cargarVotosYRevelar(){
    try{const snap=await S.db.doc('votes/'+r.id).get();if(snap.exists)votos=snap.data();}catch(e){console.warn('Votos no disponibles',e);}
    phase='result';
    render();
  }

  render();
}

// ─── R2: El agente invisible ───────────────────────────────────────
/* Quien es Quien de verdad: las pistas caen de una en una y es el usuario quien
   decide a quien descarta. Antes se revelaban los 5 datos de los 6 agentes a la
   vez y el boton "Eliminar agente" descartaba a uno arbitrario, asi que no habia
   ni deduccion ni eliminacion.

   El % de intencion real de venta es la pista que da la vuelta al reto y solo
   se ensena en el paso final: antes de eso, Andres parece el mejor de todos. */
function playAgentClues(r){
  const PASOS=[
    {id:'p1', campo:'anios',      etq:'Años de experiencia',                          elimina:2},
    {id:'p2', campo:'seguidores', etq:'Seguidores en redes',                          elimina:1,
     micro:'¿Tener seguidores significa que le llegan propietarios de verdad? Sigue mirando.'},
    {id:'p3', campo:'anuncios',   etq:'¿Tiene anuncios activos ahora mismo en Meta?', elimina:0},
    {id:'p4', campo:'leads',      etq:'Leads que le llegan al mes',                   elimina:0},
    {id:'final', campo:'intencion', etq:'De esos leads, cuántos son propietarios que quieren vender', elimina:0},
  ];
  let paso=-1;                 // -1 = intro
  const eliminados=new Set();
  let elegido=null;

  const vivos=()=>r.agents.filter(a=>!eliminados.has(a.id));
  const dato=(a,campo)=>((r.datos&&r.datos[a.id])||{})[campo]||'—';
  const pasoActual=()=>PASOS[paso];
  const camposVisibles=()=>PASOS.slice(0,paso+1);

  function fichaHtml(a,{clicable}){
    const fuera=eliminados.has(a.id);
    const filas=camposVisibles().map(function(p){
      return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:5px">
        <span style="color:var(--text-3)">${p.etq}</span>
        <span style="font-weight:700;color:${fuera?'var(--text-3)':'var(--text-1)'};white-space:nowrap">${dato(a,p.campo)}</span>
      </div>`;
    }).join('');
    return `<div class="agent-card${fuera?' eliminated':''}${elegido===a.id?' selected':''}"
      ${clicable?`data-aid="${a.id}"`:''}
      style="opacity:${fuera?'0.35':'1'};cursor:${clicable?'pointer':'default'};position:relative">
      ${fuera?`<div style="position:absolute;top:8px;right:10px;font-size:16px">✕</div>`:''}
      <div style="display:flex;align-items:center;gap:9px">
        <span class="agent-emoji" style="font-size:24px">${a.emoji}</span>
        <div><div class="agent-name" style="font-size:13px">${a.name}</div><div class="agent-handle" style="font-size:10px">${a.handle}</div></div>
      </div>
      ${filas}
    </div>`;
  }

  function render(){
    if(paso<0){
      app.innerHTML=retoShellHtml(r,`
        <div class="card">
          <div class="card-eye">Reto · Día 1</div>
          <div class="card-title">${r.title}</div>
          <div class="card-desc">${r.intro}</div>
          <div class="agents-grid">${r.agents.map(a=>fichaHtml(a,{clicable:false})).join('')}</div>
          <div style="margin-top:18px"><button class="btn btn-primary" id="next-clue-btn" style="width:100%">Ver pista 1 →</button></div>
        </div>`);
      initRetoClose(r);
      $('next-clue-btn').addEventListener('click',function(){paso=0;render();});
      return;
    }

    const p=pasoActual();

    if(p.id==='final'){
      app.innerHTML=retoShellHtml(r,`
        <div class="card">
          <div class="card-eye">Pista final</div>
          <div class="card-title" style="font-size:19px;line-height:1.3">De todos esos leads que le llegan cada mes, mira cuántos son en realidad propietarios que quieren vender.</div>
          <div class="agents-grid" style="margin-top:16px">${vivos().map(a=>fichaHtml(a,{clicable:true})).join('')}</div>
          <div style="margin:20px 0 12px;font-size:12px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">¿Quién es el agente invisible?</div>
          <button class="btn btn-primary" id="confirm-pick-btn" style="width:100%" ${elegido?'':'disabled'}>Confirmar →</button>
        </div>`);
      initRetoClose(r);
      document.querySelectorAll('[data-aid]').forEach(function(el){
        el.addEventListener('click',function(){elegido=el.dataset.aid;render();});
      });
      $('confirm-pick-btn').addEventListener('click',resultado);
      return;
    }

    const yaFuera=eliminados.size;
    const objetivo=PASOS.slice(0,paso+1).reduce(function(s,x){return s+x.elimina;},0);
    const faltan=objetivo-yaFuera;
    const puedeSeguir=faltan<=0;
    const pide=p.elimina>0;

    app.innerHTML=retoShellHtml(r,`
      <div class="card">
        <div class="card-eye">Pista ${paso+1} de 5 · ${p.etq}</div>
        <div class="card-title" style="font-size:18px">${r.title}</div>
        ${p.micro?`<div class="card-desc" style="font-style:italic">${p.micro}</div>`:''}
        ${pide?`<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">Descarta ${p.elimina===1?'a 1 agente':'a '+p.elimina+' agentes'}: toca a quien creas que no puede ser.</div>`
              :`<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">Quedan ${vivos().length}. Mira el dato antes de seguir.</div>`}
        <div class="agents-grid">${(pide?r.agents:vivos()).map(a=>fichaHtml(a,{clicable:pide})).join('')}</div>
        <div style="margin-top:18px">
          ${pide&&!puedeSeguir?`<div style="text-align:center;font-size:12px;color:var(--text-3);margin-bottom:10px">Te ${faltan===1?'queda 1 por descartar':'quedan '+faltan+' por descartar'}</div>`:''}
          <button class="btn btn-primary" id="next-clue-btn" style="width:100%" ${puedeSeguir?'':'disabled'}>${paso===PASOS.length-2?'Ver pista final →':'Ver pista '+(paso+2)+' →'}</button>
        </div>
      </div>`);
    initRetoClose(r);
    if(pide){
      document.querySelectorAll('[data-aid]').forEach(function(el){
        el.addEventListener('click',function(){
          const id=el.dataset.aid;
          if(eliminados.has(id)) eliminados.delete(id);
          else if(eliminados.size<objetivo) eliminados.add(id);
          render();
        });
      });
    }
    $('next-clue-btn').addEventListener('click',function(){if(paso<PASOS.length-1){paso++;render();}});
  }

  function resultado(){
    const a=r.agents.find(x=>x.id===elegido);
    const gotBonus=elegido===r.correctAgent;
    const bonus=gotBonus?(r.xpBonus||0):0;
    const xp=(r.xpBase||0)+bonus;
    /* Texto generico a proposito: no debe narrar el perfil del agente correcto,
       porque eso delataria la respuesta a quien haya elegido a otro. */
    app.innerHTML=retoShellHtml(r,`
      <div class="card" style="text-align:center">
        <div style="font-size:44px;margin:8px 0 14px">${a.emoji}</div>
        <div style="font-family:var(--font-d);font-size:22px;font-weight:800;margin-bottom:12px">¡Has elegido a ${a.name}!</div>
        <div style="font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:22px">¿Habrá sido la opción correcta? Ya queda menos para descubrir el porqué de cada reto que hemos hecho durante esta semana.</div>
        <div style="padding:16px;border-radius:12px;background:var(--surface-3);font-size:13px;color:var(--text-2);line-height:1.55;margin-bottom:22px">¿Por qué le llegan tantos leads y tan pocos sirven? Lo desmontamos el 23.</div>
        <button class="btn btn-primary" id="finish-btn" style="width:100%">Continuar →</button>
      </div>`,xp);
    initRetoClose(r);
    $('finish-btn').addEventListener('click',function(){completeReto(r,xp,bonus,gotBonus);});
  }

  render();
}

// ─── R3: Los 1.000€ ───────────────────────────────────────────────
function playBudget(r){
  const alloc={fotos:0,anuncios:0,videos:0,landing:0,contactos:0};
  let leadChoice=null;

  function calcStats(){
    const vis=alloc.anuncios*40;
    const ctr=0.03+(alloc.videos>=150?0.02:0);
    const clics=Math.round(vis*ctr);
    const convL=0.20+(alloc.landing>=150?0.15:0);
    const leads=Math.round(clics*convL);
    const leadsFrios=Math.round(alloc.contactos/50);
    const contestan=Math.round(leads*0.30);
    return{vis,clics,leads,leadsFrios,contestan};
  }

  function render(){
    const spent=Object.values(alloc).reduce((a,b)=>a+b,0);
    const remaining=r.totalBudget-spent;
    const channelsHtml=r.channels.map(ch=>{
      const val=alloc[ch.id]||0;
      return `<div class="budget-ch">
        <div class="budget-ch-hdr"><span style="font-size:20px">${ch.icon}</span><span class="budget-ch-name">${ch.label}</span><span class="budget-ch-val">${val}€</span></div>
        <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">${ch.desc}</div>
        <input type="range" class="budget-slider" data-ch="${ch.id}" min="0" max="${r.totalBudget}" step="50" value="${val}">
      </div>`;
    }).join('');
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Reto · Día 2</div>
        <div class="card-title">${r.title}</div><div class="card-desc">${r.intro}</div>
        <div class="budget-remaining"><span class="budget-rem-lbl">Presupuesto restante</span><span class="budget-rem-val" style="color:${remaining<0?'var(--error)':remaining===0?'var(--success)':'var(--silver-2)'}">${remaining}€</span></div>
        <div class="budget-channels">${channelsHtml}</div>
        <div style="margin-top:16px">
          <button class="btn btn-primary" id="submit-budget">Confirmar reparto →</button>
          <div id="budget-msg" style="font-size:12px;color:${remaining===0?'var(--success)':remaining<0?'var(--error)':'var(--text-3)'};text-align:center;margin-top:8px">${remaining===0?'✓ Presupuesto repartido. Pulsa confirmar.':'Reparte exactamente los '+r.totalBudget+'€ — te quedan '+remaining+'€'}</div>
        </div>
      </div>`);
    initRetoClose(r);
    document.querySelectorAll('.budget-slider').forEach(sl=>{
      sl.addEventListener('input',()=>{
        alloc[sl.dataset.ch]=parseInt(sl.value);
        const s2=Object.values(alloc).reduce((a,b)=>a+b,0);
        if(s2>r.totalBudget){alloc[sl.dataset.ch]-=s2-r.totalBudget;sl.value=alloc[sl.dataset.ch];}
        render();
      });
    });
    $('submit-budget')?.addEventListener('click',()=>{
      const s=Object.values(alloc).reduce((a,b)=>a+b,0);
      if(s===0){const m=$('budget-msg');if(m){m.style.color='var(--error)';m.textContent='Mueve al menos un slider para repartir el presupuesto.';}return;}
      if(s!==r.totalBudget){const m=$('budget-msg');if(m){m.style.color='var(--error)';m.textContent='Reparte exactamente los '+r.totalBudget+'€ — te quedan '+(r.totalBudget-s)+'€';}return;}
      showDay1();
    });
  }

  function showDay1(){
    const s=calcStats();
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Resultado · Día 1</div>
        <div class="card-title">Tu anuncio ha arrancado</div>
        <div class="budget-result-grid" style="margin-bottom:20px">
          <div class="budget-result-item"><span class="budget-result-num">${s.vis.toLocaleString()}</span><span class="budget-result-lbl">Visualizaciones</span></div>
          <div class="budget-result-item"><span class="budget-result-num">${s.clics.toLocaleString()}</span><span class="budget-result-lbl">Clics</span></div>
        </div>
        <button class="btn btn-primary" id="to-day2">Día 2 →</button>
      </div>`);
    $('rc').addEventListener('click',()=>{if(confirm('¿Salir?'))goBackToDash();});
    $('to-day2').addEventListener('click',showDay2);
  }

  function showDay2(){
    const s=calcStats();
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Resultado · Día 2</div>
        <div class="card-title">Tus leads</div>
        <div class="budget-result-grid" style="margin-bottom:8px">
          <div class="budget-result-item"><span class="budget-result-num">${s.leads}</span><span class="budget-result-lbl">Leads captados</span></div>
          <div class="budget-result-item"><span class="budget-result-num">${s.contestan}</span><span class="budget-result-lbl">Contestan</span></div>
        </div>
        ${s.leadsFrios>0?`<div style="font-size:12px;color:var(--text-3);text-align:center;margin-bottom:14px">+ ${s.leadsFrios} lead${s.leadsFrios!==1?'s':''} frío${s.leadsFrios!==1?'s':''} de tus contactos (no contestan)</div>`:''}
        <div style="background:var(--gold-dim);border:1px solid rgba(244,196,48,0.2);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:16px">
          <div style="font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:10px">Uno de esos interesados tiene una vivienda real que quiere vender. ¿Qué haces?</div>
          <div class="path-opts">${r.leadOptions.map(o=>`<button class="path-opt" data-oid="${o.id}"><span class="path-letter">${o.id}</span><span>${o.label}</span></button>`).join('')}</div>
        </div>
      </div>`);
    $('rc').addEventListener('click',()=>{if(confirm('¿Salir?'))goBackToDash();});
    let picked=false;
    document.querySelectorAll('.path-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(picked)return;picked=true;leadChoice=btn.dataset.oid;
        const ok=leadChoice===r.correctLead;
        document.querySelectorAll('.path-opt').forEach(b=>{b.setAttribute('data-locked','1');b.style.cursor='default';});
        btn.setAttribute(ok?'data-correct':'data-wrong','1');
        if(!ok)document.querySelector('[data-oid="'+r.correctLead+'"]').setAttribute('data-correct','1');
        setTimeout(showFinalResult,900);
      });
    });
  }

  function showFinalResult(){
    const s=calcStats();
    const probBase={C:70,B:45,A:30,D:20}[leadChoice]||0;
    const bonusFotos=alloc.fotos>=150?20:0;
    const probFinal=probBase+bonusFotos;
    const exito=probFinal>=70;
    const gotBonus=exito;
    const xp=r.xpBase+(gotBonus?r.xpBonus:0);
    const equilibrado=r.channels.every(ch=>(alloc[ch.id]||0)>0&&(alloc[ch.id]||0)<600);
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Resultado final</div>
        <div class="card-title">${exito?'🏆 Has generado una oportunidad.':'💀 Has quemado tu oportunidad.'}</div>
        <div class="card-desc" style="margin-bottom:16px">${exito&&equilibrado?'…incluso sin usar todo el presupuesto en un único frente.':!exito?'El lead estaba ahí. Falló la forma de reaccionar.':''}</div>
        <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:16px">
          <div style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Tu distribución</div>
          ${r.channels.map(ch=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:13px"><span>${ch.icon} ${ch.label}</span><span style="font-family:var(--font-d);font-weight:700">${alloc[ch.id]||0}€</span></div>`).join('')}
        </div>
        <button class="btn btn-primary" id="finish-btn">Ver mis XP →</button>
      </div>`,xp);
    $('rc').addEventListener('click',()=>{if(confirm('¿Salir?'))goBackToDash();});
    $('finish-btn').addEventListener('click',()=>completeReto(r,xp,r.xpBonus,gotBonus));
  }
  render();
}

// ─── R4: El embudo roto ────────────────────────────────────────────
function playFunnel(r){
  const revealed=new Set();
  let chosen=null,phase='investigate';

  function buildCascadeHtml(){
    return `<div style="display:flex;flex-wrap:wrap;gap:6px">${r.stages.map(s=>`<div style="display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);flex:1;min-width:130px"><span style="font-size:14px">${s.icon}</span><span style="font-size:11px;color:var(--text-2);flex:1">${s.label}</span><span style="font-family:var(--font-d);font-size:13px;font-weight:800;color:var(--silver-1)">${s.value}</span></div>`).join('')}</div>`;
  }

  function buildSuspectsHtml(){
    return r.suspects.map(s=>{
      const isRev=revealed.has(s.id);
      const isSel=phase==='pick'&&chosen===s.id;
      return `<div class="funnel-suspect${isSel?' selected':''}" data-sid="${s.id}">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">${s.icon}</span>
          <span style="flex:1;font-size:14px;font-weight:600">${s.label}</span>
          ${phase==='investigate'?`<button class="btn-inv ${isRev?'inv-done':''}" data-inv="${s.id}">${isRev?'✓ Investigado':'🔍 Investigar'}</button>`:''}
        </div>
        ${isRev?`<div style="font-size:13px;color:var(--text-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${s.clue}</div>`:''}
      </div>`;
    }).join('');
  }

  function render(){
    const allInv=r.suspects.every(s=>revealed.has(s.id));
    app.innerHTML=retoShellHtml(r,`
      <div class="card" style="padding:20px 18px"><div class="card-eye">Reto · Día 2</div>
        <div class="card-title">${r.title}</div>
        <div class="card-desc">${r.intro}</div>
        <div style="margin-bottom:12px">${buildCascadeHtml()}</div>
      </div>
      <div class="card" style="padding:20px 18px">
        <div style="font-size:12px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px">${phase==='investigate'?'Investiga los sospechosos':'¿Dónde está la fuga?'}</div>
        <div style="display:flex;flex-direction:column;gap:8px">${buildSuspectsHtml()}</div>
        <div style="margin-top:16px">
          ${phase==='investigate'
            ?`<button class="btn btn-primary" id="to-pick" ${allInv?'':'disabled'}>¿Dónde está la fuga? →</button>${!allInv?`<div style="font-size:12px;color:var(--text-3);text-align:center;margin-top:6px">Investiga todos los puntos primero</div>`:''}`
            :`<button class="btn btn-primary" id="confirm-funnel" ${chosen?'':'disabled'}>Confirmar →</button>`}
        </div>
      </div>`);
    initRetoClose(r);
    document.querySelectorAll('.btn-inv').forEach(btn=>{
      btn.addEventListener('click',e=>{e.stopPropagation();revealed.add(btn.dataset.inv);render();});
    });
    $('to-pick')?.addEventListener('click',()=>{phase='pick';render();});
    if(phase==='pick'){
      document.querySelectorAll('.funnel-suspect').forEach(el=>{
        el.style.cursor='pointer';
        el.addEventListener('click',()=>{chosen=el.dataset.sid;render();});
      });
      $('confirm-funnel')?.addEventListener('click',showFunnelResult);
    }
  }

  function showFunnelResult(){
    const gotBonus=chosen===r.brokenStage;
    const bonus=gotBonus?(r.xpBonus||0):0;
    const xp=(r.xpBase||0)+bonus;
    const elegida=r.suspects.find(s=>s.id===chosen);
    /* Sin veredicto. Antes decia '¡Correcto! La fuga estaba en X' y marcaba
       '← LA FUGA' sobre el sospechoso bueno, dando la respuesta hecha. */
    app.innerHTML=retoShellHtml(r,`
      <div class="card" style="text-align:center">
        <div style="font-size:44px;margin:8px 0 14px">${elegida?elegida.icon:'📩'}</div>
        <div style="font-family:var(--font-d);font-size:22px;font-weight:800;margin-bottom:14px">¡Hemos recibido tu respuesta!</div>
        <div style="font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:16px">Has señalado <b>${elegida?elegida.label:''}</b> como el punto donde se rompe el embudo.</div>
        <div style="font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:22px">No te vamos a decir todavía si has acertado. El 23 de septiembre lo vemos juntos: dónde estaba la fuga de verdad, y por qué se escapa tanta gente justo en ese punto.</div>
        <div style="padding:16px;border-radius:12px;background:var(--surface-3);font-size:13px;color:var(--text-2);line-height:1.55;margin-bottom:22px">Guardamos tu respuesta. El 23 de septiembre lo desmontamos entero.</div>
        <button class="btn btn-primary" id="finish-btn" style="width:100%">Continuar →</button>
      </div>`,xp);
    initRetoClose(r);
    $('finish-btn').addEventListener('click',function(){completeReto(r,xp,bonus,gotBonus);});
  }
  render();
}

// ─── R5: La operación imposible ────────────────────────────────────
function playGraph(r){
  let phase='node',pickedNode=null,pickedDest=null;

  function renderPhaseNode(){
    const nodesHtml=r.nodes.map(n=>`
      <button class="path-opt" data-nid="${n.id}">
        <span class="path-letter" style="font-size:16px">${n.icon}</span>
        <span>${n.label}</span>
      </button>`).join('');
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Reto · Día 3 · Paso 1 de 2</div>
        <div class="card-title">${r.title}</div>
        <div class="card-desc">${r.intro}</div>
        <div style="font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:12px">¿A través de quién llegas al comprador?</div>
        <div class="path-opts">${nodesHtml}</div>
      </div>`);
    initRetoClose(r);
    document.querySelectorAll('.path-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{pickedNode=btn.dataset.nid;phase='dest';renderPhaseDest();});
    });
  }

  function renderPhaseDest(){
    const node=r.nodes.find(n=>n.id===pickedNode);
    const destsHtml=r.destinations.map(d=>`
      <button class="path-opt" data-did="${d.id}">
        <span class="path-letter" style="font-size:16px">${d.icon}</span>
        <span>${d.label}</span>
      </button>`).join('');
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Reto · Día 3 · Paso 2 de 2</div>
        <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">Vía: ${node?node.icon+' '+node.label:''}</div>
        <div class="card-title">¿A qué comprador apuntas?</div>
        <div class="path-opts" style="margin-top:16px">${destsHtml}</div>
        <button class="btn btn-outline" id="back-node" style="margin-top:10px;width:100%">← Volver a elegir canal</button>
      </div>`);
    initRetoClose(r);
    $('back-node')?.addEventListener('click',()=>{phase='node';pickedNode=null;renderPhaseNode();});
    document.querySelectorAll('.path-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{pickedDest=btn.dataset.did;showGraphResult();});
    });
  }

  function showGraphResult(){
    const node=r.nodes.find(n=>n.id===pickedNode);
    const dest=r.destinations.find(d=>d.id===pickedDest);
    const connType=node&&node.connects&&node.connects[pickedDest];
    const optimal=pickedNode===r.correctNode&&pickedDest===r.correctDest;
    const possible=!!connType;
    const gotBonus=optimal;
    const xp=r.xpBase+(gotBonus?r.xpBonus:0);
    let verdict,color,hint;
    if(optimal){verdict='Camino óptimo';color='var(--gold)';hint='Conexión directa y rápida al comprador correcto.';}
    else if(connType==='slow'){verdict='Camino lento';color='var(--text-2)';hint='Puedes llegar, pero tardarás mucho más.';}
    else if(connType==='partial'){verdict='Acceso parcial';color='var(--text-2)';hint='Llegas pero con fricción importante.';}
    else{verdict='Callejón sin salida';color='var(--error)';hint='Este canal no conecta con ese comprador.';}
    const correctNode=r.nodes.find(n=>n.id===r.correctNode);
    const correctDest=r.destinations.find(d=>d.id===r.correctDest);
    app.innerHTML=retoShellHtml(r,`
      <div class="card"><div class="card-eye">Resultado</div>
        <div class="card-title">${optimal?'Camino óptimo encontrado.':possible?'Llegas, pero no es lo mejor.':'Sin salida — a intentarlo de otra forma.'}</div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface-2);border-radius:var(--r-sm);border:1px solid var(--border);margin-bottom:16px">
          <span style="font-size:24px">${node?node.icon:''}</span>
          <div style="font-size:16px;color:var(--text-3)">→</div>
          <span style="font-size:24px">${dest?dest.icon:''}</span>
          <div style="flex:1"><div style="font-size:13px;font-weight:700;color:${color}">${verdict}</div><div style="font-size:12px;color:var(--text-3);margin-top:2px">${hint}</div></div>
        </div>
        ${!optimal?`<div style="font-size:13px;color:var(--text-3);margin-bottom:16px">El camino óptimo era: <strong style="color:var(--gold)">${correctNode?correctNode.icon+' '+correctNode.label:''} → ${correctDest?correctDest.icon+' '+correctDest.label:''}</strong></div>`:''}
        <button class="btn btn-primary" id="finish-btn">Ver mis XP →</button>
      </div>`,xp);
    $('rc').addEventListener('click',()=>{if(confirm('¿Salir?'))goBackToDash();});
    $('finish-btn').addEventListener('click',()=>completeReto(r,xp,r.xpBonus,gotBonus));
  }
  renderPhaseNode();
}

// ─── R6: El farol ──────────────────────────────────────────────────
function playBluff(r){
  let round1Answer=null,round2Answer=null;

  function metricsForChoice(roundMetrics,choice){
    const m=roundMetrics[choice];
    if(!m)return'';
    return `<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-top:12px">
      <div style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Tu decisión — métricas estimadas</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div style="text-align:center"><div style="font-family:var(--font-d);font-size:16px;font-weight:800">${m.prob}</div><div style="font-size:10px;color:var(--text-3)">Probabilidad cierre</div></div>
        <div style="text-align:center"><div style="font-family:var(--font-d);font-size:16px;font-weight:800">${m.comision}</div><div style="font-size:10px;color:var(--text-3)">Comisión</div></div>
        <div style="text-align:center"><div style="font-family:var(--font-d);font-size:16px;font-weight:800">${m.tiempo}</div><div style="font-size:10px;color:var(--text-3)">Tiempo</div></div>
      </div>
    </div>`;
  }

  function renderRound1(){
    const optsHtml=r.options.map(o=>`<button class="path-opt" data-oid="${o.id}"><span class="path-letter">${o.id}</span><span>${o.label}</span></button>`).join('');
    app.innerHTML=retoShellHtml(r,`
      <div class="card">
        <div class="card-eye">Ronda 1 de 2</div>
        <div class="card-desc" style="margin-bottom:18px">${r.intro}</div>
        <div class="card-title" style="font-size:19px;line-height:1.35;margin-bottom:14px">${r.round1.scenario}</div>
        <div class="path-opts" id="opts1">${optsHtml}</div>
      </div>`);
    initRetoClose(r);
    let picked=false;
    document.querySelectorAll('.path-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(picked)return;picked=true;
        round1Answer=btn.dataset.oid;
        document.querySelectorAll('.path-opt').forEach(b=>{b.setAttribute('data-locked','1');b.style.cursor='default';});
        btn.setAttribute('data-chosen','1');
        const metricsEl=document.createElement('div');
        metricsEl.innerHTML=metricsForChoice(r.round1.metrics,round1Answer);
        document.querySelector('#opts1').parentNode.appendChild(metricsEl);
        const nextEl=document.createElement('div');nextEl.style.marginTop='16px';
        nextEl.innerHTML=`<button class="btn btn-primary" id="to-round2">Nueva información →</button>`;
        document.querySelector('#opts1').parentNode.appendChild(nextEl);
        $('to-round2').addEventListener('click',renderRound2);
      });
    });
  }

  function renderRound2(){
    const optsHtml=r.options.map(o=>`<button class="path-opt" data-oid="${o.id}"><span class="path-letter">${o.id}</span><span>${o.label}</span></button>`).join('');
    app.innerHTML=retoShellHtml(r,`
      <div class="card">
        <div class="card-eye">Ronda 2 de 2</div>
        <div style="background:rgba(244,196,48,0.08);border:1px solid rgba(244,196,48,0.25);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px">
          <div style="font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">Nueva información</div>
          <div style="font-size:14px">${r.round2.scenario}</div>
        </div>
        <div style="font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:12px">¿Cambias tu decisión?</div>
        <div class="path-opts" id="opts2">${optsHtml}</div>
      </div>`);
    initRetoClose(r);
    let picked=false;
    document.querySelectorAll('.path-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(picked)return;picked=true;
        round2Answer=btn.dataset.oid;
        document.querySelectorAll('.path-opt').forEach(b=>{b.setAttribute('data-locked','1');b.style.cursor='default';});
        btn.setAttribute('data-chosen','1');
        const metricsEl=document.createElement('div');
        metricsEl.innerHTML=metricsForChoice(r.round2.metrics,round2Answer);
        document.querySelector('#opts2').parentNode.appendChild(metricsEl);
        const nextEl=document.createElement('div');nextEl.style.marginTop='16px';
        nextEl.innerHTML=`<button class="btn btn-primary" id="to-final">Ver resultado →</button>`;
        document.querySelector('#opts2').parentNode.appendChild(nextEl);
        $('to-final').addEventListener('click',showBluffResult);
      });
    });
  }

  function showBluffResult(){
    const gotBonus=round2Answer===r.correctOption;
    const bonus=gotBonus?(r.xpBonus||0):0;
    const xp=(r.xpBase||0)+bonus;
    const cambio=round1Answer!==round2Answer;
    const opt2=r.round2.metrics[round2Answer];
    /* Sin veredicto. Antes el titulo decia 'Decision optima en la ronda 2' o
       '¿Era la mejor jugada?' y ademas pintaba de dorado la opcion elegida
       cuando era la buena. Lo de mantuvo/cambio si se queda: es un hecho de lo
       que hizo el usuario, no un juicio sobre si acerto. */
    app.innerHTML=retoShellHtml(r,`
      <div class="card" style="text-align:center">
        <div style="font-size:44px;margin:8px 0 12px">🃏</div>
        <div style="font-family:var(--font-d);font-size:22px;font-weight:800;margin-bottom:10px">¡Hemos recibido tu respuesta!</div>
        <div style="font-size:14px;color:var(--text-2);margin-bottom:20px">${cambio?'Cambiaste de estrategia al ver la nueva información.':'Mantuviste tu decisión inicial.'}</div>
        <div style="display:flex;gap:12px;margin-bottom:18px;text-align:center">
          <div style="flex:1;padding:10px;background:var(--surface-2);border-radius:var(--r-sm)">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:4px">Ronda 1</div>
            <div style="font-family:var(--font-d);font-size:18px;font-weight:800">${round1Answer}</div>
          </div>
          <div style="display:flex;align-items:center;font-size:16px;color:var(--text-3)">${cambio?'→':'='}</div>
          <div style="flex:1;padding:10px;background:var(--surface-2);border-radius:var(--r-sm)">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:4px">Ronda 2</div>
            <div style="font-family:var(--font-d);font-size:18px;font-weight:800">${round2Answer}</div>
          </div>
        </div>
        ${opt2?`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:18px">
          <div style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Métricas de tu decisión</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div><div style="font-family:var(--font-d);font-size:16px;font-weight:800">${opt2.prob}</div><div style="font-size:10px;color:var(--text-3)">Prob. cierre</div></div>
            <div><div style="font-family:var(--font-d);font-size:16px;font-weight:800">${opt2.comision}</div><div style="font-size:10px;color:var(--text-3)">Comisión</div></div>
            <div><div style="font-family:var(--font-d);font-size:16px;font-weight:800">${opt2.tiempo}</div><div style="font-size:10px;color:var(--text-3)">Tiempo</div></div>
          </div>
        </div>`:''}
        <div style="padding:16px;border-radius:12px;background:var(--surface-3);font-size:13px;color:var(--text-2);line-height:1.55;margin-bottom:20px">¿Por qué puede tener sentido? El 23 de septiembre.</div>
        <button class="btn btn-primary" id="finish-btn" style="width:100%">Continuar →</button>
      </div>`,xp);
    initRetoClose(r);
    $('finish-btn').addEventListener('click',function(){completeReto(r,xp,bonus,gotBonus);});
  }
  renderRound1();
}

}
